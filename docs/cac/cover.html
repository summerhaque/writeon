<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../website/assets/css/site.css">
<style>
:root{color-scheme:light}
html,body{width:600px;height:800px;overflow:hidden;background:#F4F9FD}

.canvas{width:600px;height:800px;display:flex;flex-direction:column;align-items:center;padding:44px 40px 0;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,#F4F9FD 0%,#E9F3FB 100%)}
.logo{height:104px;width:auto}
h1{font-size:54px;line-height:1.02;letter-spacing:-.035em;margin:26px 0 12px}
.one{font-size:17px;line-height:1.45;color:#4D6480;max-width:25em}
.by{margin-top:14px;font:700 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#1F6FB2}
.art{position:relative;margin-top:30px;text-align:left;transform:translateX(-58px)}
.art .phone{width:290px}
.art .phone-screen{height:560px}
.art > .cover{position:absolute;right:-138px;bottom:118px;--w:150px;transform:rotate(6deg)}

</style></head><body><svg width="0" height="0" class="defs" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9Z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v2h3.5v2.5a4.5 4.5 0 0 1-4.3 4.5A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 7.8 12a4.5 4.5 0 0 1-4.3-4.5V5H7Zm-1.5 4v.5A2.5 2.5 0 0 0 7 9.8V7Zm13 0H17v2.8a2.5 2.5 0 0 0 1.5-2.3Z"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path fill="currentColor" d="M12.6 2c.8 3.4 4.9 5.5 4.9 10.4a5.5 5.5 0 0 1-11 0c0-2.6 1.3-4.2 2.6-5.4.2 1.7 1 2.7 2.1 3.2-.1-3.2.4-5.9 1.4-8.2Z"/></symbol>
    <symbol id="sparkle" viewBox="0 0 24 24">
      <path d="M12 1.5c.5 4.9 2.6 8 8.5 10.5-5.9 2.5-8 5.6-8.5 10.5-.5-4.9-2.6-8-8.5-10.5C9.4 9.5 11.5 6.4 12 1.5Z" style="fill: var(--accent)"/>
    </symbol>
  </svg>

<div class="canvas">
<img class="logo" src="../../website/assets/brand/writeon-logo-stacked.svg" alt="">
<h1>Find your voice<span class="pt">.</span></h1>
<p class="one">A creative writing app that gives every young writer their own AI writing coach, from a first idea to a published book.</p>
<p class="by">Summer Haque</p>
<div class="art"><figure class="phone" aria-label="The story path in the Write On! app">
          <div class="phone-screen">
            <div class="ph-status"><span>9:41</span><span class="ph-island"></span><span class="ph-dots">●●●</span></div>
            <div class="ph-head">
              <div class="cover cover-classic c-indigo cover-xs" aria-hidden="true"><div class="cover-frame"><span class="cover-title">The Tower of Fibs</span></div></div>
              <div>
                <p class="ph-title">The Tower of Fibs</p>
                <p class="ph-meta">Fantasy · Short story</p>
              </div>
            </div>
            <div class="ph-meter" aria-hidden="true">
              <i class="done s1"></i><i class="done s2"></i><i class="half s3"></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <p class="ph-note">Start anywhere. Every stage is open, in any order.</p>
            <ol class="ph-path">
              <li class="done s1"><b>✓</b><span>Idea<small>Done</small></span></li>
              <li class="done s2"><b>✓</b><span>Characters<small>3 characters</small></span></li>
              <li class="next s3"><b>3</b><span>Setting <em>Up next</em><small>In progress</small></span></li>
              <li><b>4</b><span>Conflict<small>What stands in the way</small></span></li>
              <li><b>5</b><span>Plot<small>What happens, start to finish</small></span></li>
              <li><b>6</b><span>Writing<small>The words themselves</small></span></li>
              <li><b>7</b><span>Revising<small>Make every sentence count</small></span></li>
            </ol>
          </div>
        </figure>
<div class="cover cover-classic c-indigo"><div class="cover-frame"><span class="cover-title">The Tower of Fibs</span><i class="cover-line"></i></div><div class="stamp"><i>★</i><b>Published</b><small>Oct 10, 2026</small></div></div>
</div></div></body></html>
